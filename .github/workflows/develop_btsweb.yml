# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
name: Build and deploy Node.js app to Azure Web App - btwweb
on:
  push:
    branches:
      - develop
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install dependencies and build (frontend)
        working-directory: ./frontend   # 👈 Aquí está tu package.json
        run: |
          npm ci
          npm run build --if-present
        env:
          CI: false
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: frontend/build   # 👈 Carpeta que se genera con el build de React
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
      - name: Verify downloaded files (debug)
        run: |
          echo "Listing downloaded files:"
          ls -R
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'btsweb'
          slot-name: 'development'   # o 'Production', según el Publish Profile correcto
          publish-profile: ${{ secrets.DEVELOPMENT }}
          package: '.'               # 👈 Aquí el cambio: el build ya está en el root