name: Deploy Frontend to Azure

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          CI=false npm run build

      - name: Create package.json for static server
        run: |
          cat > ./frontend/build/server.js << 'EOF'
          const { spawn } = require('child_process');
          const fs = require('fs');
          const path = require('path');

          const env = {
            REACT_APP_STRAPI_URL: process.env.REACT_APP_STRAPI_URL || '',
            REACT_APP_STRAPI_TOKEN: process.env.REACT_APP_STRAPI_TOKEN || ''
            REACT_APP_RECAPTCHA_SITE_KEY: process.env.REACT_APP_RECAPTCHA_SITE_KEY || ''
          };

          fs.writeFileSync(
            path.join(__dirname, 'env.js'),
            `window.__ENV__ = ${JSON.stringify(env)};`
          );

          const npxCmd = process.platform === 'win32' ? 'npx.cmd' : 'npx';
          const child = spawn(npxCmd, ['serve', '-s', '.', '-l', '8080'], {
            stdio: 'inherit'
          });

          child.on('exit', (code) => process.exit(code ?? 0));
          EOF

          cat > ./frontend/build/package.json << 'EOF'
          {
            "name": "btsweb-static",
            "version": "1.0.0",
            "description": "Static server for React app",
            "scripts": {
              "start": "node server.js"
            },
            "dependencies": {
              "serve": "^14.2.1"
            }
          }
          EOF

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./build

      - name: Debug - Verify build structure
        run: |
          echo "=== Contenido del directorio build ==="
          ls -la ./build
          echo ""
          echo "=== Verificar package.json ==="
          cat ./build/package.json

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: btsweb
          slot-name: development
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_150D4D4F38CF4051804B4966F0A9B4C5 }}
          package: ./build