# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - btwweb-strapidev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies and build (frontend)
        working-directory: ./frontend   # 👈 Aquí está tu package.json
        run: |
          npm ci
          npm run build --if-present

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: frontend/build   # 👈 Carpeta que se genera con el build de React

    deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'btwweb-strapidev'
          slot-name: 'Development'      # 👈 ajustado al entorno correcto
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_28CF2CD24D794D8D8F4FB43189C344EB }}
          package: 'frontend/build'     # 👈 ruta correcta dentro del artefacto