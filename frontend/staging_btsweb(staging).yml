name: Deploy Frontend to Azure

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          CI=false npm run build

      - name: Create package.json for static  server
        run: |
          cat > ./frontend/build/package.json << 'EOF'
          {
            "name": "btsweb-static",
            "version": "1.0.0",
            "description": "Static server for React app",
            "scripts": {
              "start": "npx serve -s . -l 8080"
            },
            "dependencies": {
              "serve": "^14.2.1"
            }
          }
          EOF

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./build

      - name: Debug - Verify build structure
        run: |
          echo "=== Contenido del directorio build ==="
          ls -la ./build
          echo ""
          echo "=== Verificar package.json ==="
          cat ./build/package.json

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: btsweb
          slot-name: staging
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BTSWEB_STAGING }}
          package: ./build